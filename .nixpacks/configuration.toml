[variables]
NIXPACKS_PATH = "/app/node_modules/.bin:$NIXPACKS_PATH"

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm", "python3", "python3Packages.pip", "python3Packages.setuptools", "python3Packages.wheel"]
commands = []

[phases.install]
commands = [
  "cd backend && pip install -r requirements.txt"
]

[phases.build]
commands = ["pnpm run build"]

[start]
command = "cd backend && python -m uvicorn olifan_backend_api:app --host 0.0.0.0 --port $PORT"