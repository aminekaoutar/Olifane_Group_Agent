[variables]
NIXPACKS_PATH = "/app/node_modules/.bin:$NIXPACKS_PATH"

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm", "python311", "python311Packages.pip"]
commands = []

[phases.install]
commands = ["pnpm install --no-frozen-lockfile"]

[phases.build]
commands = ["pnpm run build"]

[start]
command = "cd backend && python -m uvicorn olifan_backend_api:app --host 0.0.0.0 --port $PORT"